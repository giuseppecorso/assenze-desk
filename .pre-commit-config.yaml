# Controlli automatici a ogni commit. Installazione (una volta): pre-commit install
# Prova su tutti i file: pre-commit run --all-files
default_install_hook_types: [pre-commit, commit-msg]
# Gli hook girano sui file; sul messaggio di commit solo il controllo privacy
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: \.(cmd|bat)$  # gli script di Windows restano CRLF (.gitattributes)

  # Stessa versione di ruff installata nel .venv (pyproject.toml)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Controllo privacy con la denylist locale (vedi scripts/check_privacy.py)
  - repo: local
    hooks:
      - id: privacy
        name: controllo privacy dei file
        language: python
        entry: python scripts/check_privacy.py
      - id: privacy-messaggio
        name: controllo privacy del messaggio di commit
        language: python
        entry: python scripts/check_privacy.py --commit-msg
        stages: [commit-msg]
