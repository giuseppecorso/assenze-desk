# A ogni push e pull request: stile, test e controllo privacy, su Linux.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Ruff e pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
      # Librerie di sistema che Qt carica anche senza schermo (piattaforma offscreen)
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest --cov=assenze_desk --cov-report=term-missing

  privacy:
    name: Controllo privacy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # La denylist sta nel secret PRIVACY_DENYLIST e non viene mai stampata.
      # Senza secret il controllo sarebbe incompleto: il job fallisce.
      - name: Denylist dal secret
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "$PRIVACY_DENYLIST" ]; then
            echo "::error::Manca il secret PRIVACY_DENYLIST (vedi scripts/check_privacy.py)."
            exit 1
          fi
          printf '%s\n' "$PRIVACY_DENYLIST" > .privacy-denylist.txt
      - run: python scripts/check_privacy.py --all
