[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "assenze-desk"
version = "0.1.0"
description = "Gestione di malattie e giustificativi a partire dalle mail: estrazione dei dati con regole testate, bozze di risposta, archivio locale."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Giuseppe Corso" }]
classifiers = [
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: Italian",
    # Impedisce la pubblicazione per errore su PyPI
    "Private :: Do Not Upload",
]
# Le librerie dell'app (PySide6, pywin32, openpyxl, pypdf, OCR) si aggiungono
# nella fase che le usa: per ora il progetto non dipende da nulla.
dependencies = []

[project.optional-dependencies]
# Strumenti di sviluppo: pip install -e ".[dev]"
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff==0.16.10",
    "pre-commit>=4.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: a fine run elenca il motivo di ogni test saltato o fallito
addopts = "-ra"
